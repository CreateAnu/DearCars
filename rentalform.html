<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <title>Rental Form</title>
</head>
<body class="hero-body">
  
  <!-- Same Header -->
  <header class="hero-box">
    <div class="flex-container">
      <div class="logo">
        <img src="/img/newlogo.png" alt="Logo" />
      </div>
      <div class="icons">
        <i class="fa-solid fa-phone"> +91 9167305752</i>
        <i class="fa-solid fa-location-dot"> Location</i>
      </div>
    </div>
    <div class="flex-container2">
      <nav class="menu">
        <ul class="nav-list">
          <li class="nav-item"><a href="/index.html" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="/contact.html" class="nav-link">Contact</a></li>
          <li class="nav-item"><a href="/company.html" class="nav-link">Company Info</a></li>
          <li class="nav-item"><a href="/rentalform.html" class="nav-link active">Rental Form</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section style="padding: 2rem; text-align: center;">
    <h1>Rental Form</h1>
    <form style="max-width: 600px; margin: auto;">
      <input type="text" placeholder="Full Name" required style="width: 100%; padding: 10px; margin-bottom: 1rem;" />
      <input type="email" placeholder="Email Address" required style="width: 100%; padding: 10px; margin-bottom: 1rem;" />
      <input type="text" placeholder="Phone Number" required style="width: 100%; padding: 10px; margin-bottom: 1rem;" />
      <select required style="width: 100%; padding: 10px; margin-bottom: 1rem;">
        <option value="">Select Car Model</option>
        <option>Rolls Royce</option>
        <option>Ferrari</option>
        <option>Lamborghini</option>
        <option>Bentley</option>
      </select>
      <input type="date" required style="width: 100%; padding: 10px; margin-bottom: 1rem;" />
      <input type="date" required style="width: 100%; padding: 10px; margin-bottom: 1rem;" />
      <button class="btn" type="submit">Book Now</button>
    </form>
  </section>

</body>
</html>
