    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 1rem;
        background-color: #f5f5f5;
      }

      .filter-bar {
        display: flex;
        gap: 1rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        align-items: center;
      }

      .itemsflex {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
      }

      .car-card {
        border: 1px solid #ccc;
        border-radius: 8px;
        width: 300px;
        padding: 1rem;
        background-color: #fff;
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        cursor: pointer;
      }

      .car-card img {
        width: 100%;
        border-radius: 6px;
      }

      .car-card h3 {
        margin: 0.5rem 0 0.2rem;
      }

      /* Modal */
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        display: none;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        justify-content: center;
        align-items: center;
        z-index: 999;
      }

      .modal-content {
        background: #fff;
        width: 90%;
        max-width: 900px;
        display: flex;
        flex-wrap: wrap;
        border-radius: 10px;
        overflow: hidden;
        position: relative;
      }

      .modal-left {
        flex: 1;
        min-width: 300px;
        background: #000;
        position: relative;
      }

      .carousel-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: none;
      }

      .carousel-img.active {
        display: block;
      }

      .carousel-controls {
        position: absolute;
        top: 50%;
        width: 100%;
        display: flex;
        justify-content: space-between;
        transform: translateY(-50%);
      }

      .carousel-controls button {
        background: rgba(255, 255, 255, 0.7);
        border: none;
        padding: 10px;
        cursor: pointer;
      }

      .modal-right {
        flex: 1;
        padding: 1rem;
      }

      .modal-right h2 {
        margin-top: 0;
      }

      .close-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        background: crimson;
        color: #fff;
        border: none;
        border-radius: 50%;
        font-size: 1rem;
        width: 30px;
        height: 30px;
        cursor: pointer;
      }

      .specs p {
        margin: 0.3rem 0;
      }
    </style>

      const brandFilter = document.getElementById("brandFilter");
      const yearFilter = document.getElementById("yearFilter");
      const carGallery = document.getElementById("carGallery");

      const closeModal = document.getElementById("closeModal");
      const carouselImage = document.getElementById("carouselImage");
      const carDetails = document.getElementById("carDetails");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      let currentImages = [];
      let currentIndex = 0;

      const brands = ["All", ...new Set(cars.map((car) => car.brand))];
      const years = ["All", ...new Set(cars.map((car) => car.year))];

      function populateFilters() {
        brands.forEach((brand) => {
          const option = document.createElement("option");
          option.value = brand;
          option.textContent = brand;
          brandFilter.appendChild(option);
        });
        years.forEach((year) => {
          const option = document.createElement("option");
          option.value = year;
          option.textContent = year;
          yearFilter.appendChild(option);
        });
      }

      function renderCars() {
        const selectedBrand = brandFilter.value;
        const selectedYear = yearFilter.value;

        const filteredCars = cars.filter((car) => {
          const brandMatch =
            selectedBrand === "All" || car.brand === selectedBrand;
          const yearMatch = selectedYear === "All" || car.year == selectedYear;
          return brandMatch && yearMatch;
        });

        carGallery.innerHTML = "";
        filteredCars.forEach((car, index) => {
          const card = document.createElement("div");
          card.className = "car-card";
          card.innerHTML = `
              <img src="${car.image}" alt="${car.title}">
              <h3>${car.title}</h3>
              <p>${car.desc}</p>
              <p><strong>Price:</strong> ${car.price}</p>
            `;
          card.addEventListener("click", () => showCarModal(car));
          carGallery.appendChild(card);
        });
      }

      function showCarModal(car) {
        currentImages = [...car.exteriorImages, ...car.interiorImages];
        currentIndex = 0;
        updateCarouselImage();

        carDetails.innerHTML = `
            <h2>${car.title}</h2>
            <p>${car.desc}</p>
            <div class="specs">
              <p><strong>Model:</strong> ${car.model}</p>
              <p><strong>Year:</strong> ${car.year}</p>
              <p><strong>Engine:</strong> ${car.engine}</p>
              <p><strong>Transmission:</strong> ${car.transmission}</p>
              <p><strong>Horsepower:</strong> ${car.horsepower}</p>
              <p><strong>Top Speed:</strong> ${car.topSpeed}</p>
              <p><strong>0-100:</strong> ${car.zeroToHundred}</p>
              <p><strong>Price:</strong> ${car.price}</p>
            </div>
          `;
        modal.style.display = "flex";
      }

      function updateCarouselImage() {
        carouselImage.src = currentImages[currentIndex];
      }

      prevBtn.addEventListener("click", () => {
        currentIndex =
          (currentIndex - 1 + currentImages.length) % currentImages.length;
        updateCarouselImage();
      });

      nextBtn.addEventListener("click", () => {
        currentIndex = (currentIndex + 1) % currentImages.length;
        updateCarouselImage();
      });

      closeModal.addEventListener("click", () => {
        modal.style.display = "none";
      });

      window.addEventListener("click", (e) => {
        if (e.target === modal) modal.style.display = "none";
      });

      brandFilter.addEventListener("change", renderCars);
      yearFilter.addEventListener("change", renderCars);

      populateFilters();
      renderCars();
    </script>
