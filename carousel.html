    <script src="js/menumove.js"></script>
    <script>
      const slider = document.getElementById("carouselSlider");
      const banner = document.getElementById("carouselBanner");
      let currentAngle = 0;
      let isDragging = false;
      let lastX = 0;
      let rotationSpeed = 0;
      const friction = 0.95;
      const minRotationSpeed = 0.1;
      const angleIncrement = 360 / parseInt(slider.style.getPropertyValue('--quantity'));

      function animateRotation() {
        if (!isDragging) {
          rotationSpeed *= friction;
          if (Math.abs(rotationSpeed) < minRotationSpeed) {
            rotationSpeed = 0;
          }
        }
        currentAngle += rotationSpeed;
        slider.style.transform = `translateX(-50%) rotateY(${currentAngle}deg)`;
        requestAnimationFrame(animateRotation);
      }
      
      animateRotation();

      banner.addEventListener("mousedown", (e) => {
        isDragging = true;
        lastX = e.clientX;
        rotationSpeed = 0;
        banner.style.cursor = "grabbing";
      });

      document.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - lastX;
        rotationSpeed = deltaX * 0.3;
        currentAngle += rotationSpeed;
        lastX = e.clientX;
      });

      document.addEventListener("mouseup", () => {
        isDragging = false;
        banner.style.cursor = "grab";
      });

      banner.addEventListener("touchstart", (e) => {
        isDragging = true;
        lastX = e.touches[0].clientX;
        rotationSpeed = 0;
      });

      document.addEventListener("touchmove", (e) => {
        if (!isDragging) return;
        const deltaX = e.touches[0].clientX - lastX;
        rotationSpeed = deltaX * 0.3;
        currentAngle += rotationSpeed;
        lastX = e.touches[0].clientX;
      });

      document.addEventListener("touchend", () => {
        isDragging = false;
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") {
          currentAngle += angleIncrement;
          rotationSpeed = 0;
          slider.style.transform = `translateX(-50%) rotateY(${currentAngle}deg)`;
          e.preventDefault();
        } else if (e.key === "ArrowRight") {
          currentAngle -= angleIncrement;
          rotationSpeed = 0;
          slider.style.transform = `translateX(-50%) rotateY(${currentAngle}deg)`;
          e.preventDefault();
        }
      });

      document.addEventListener('keyup', (e) => {
          if (e.key === 'Tab' || e.key.includes('Arrow')) {
              document.body.classList.add('keyboard-nav');
          }
      });
      document.addEventListener('mousedown', () => {
          document.body.classList.remove('keyboard-nav');
      });

    </script>
