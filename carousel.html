<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Carousel</title>
    
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/glightbox.min.css" />
    <link rel="stylesheet" href="/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/carousel.css" />
    <title>Big Cars</title>
  </head>
  <body class="hero-body">
    <header class="hero-box">
      <div class="flex-container">
        <div class="logo">
          <img src="/img/High Wheels.png" alt="Logo" />
        </div>
        <div class="icons">
          <i class="fa-solid fa-phone"> +91 9167305752</i>
          <i class="fa-solid fa-location-dot"> Location</i>
        </div>
      </div>

      <div class="flex-container2">
        <nav class="menu">
          <ul class="nav-list">
            <li class="nav-item">
              <a href="index.html" class="nav-link active">Home</a>
            </li>
            <li class="nav-item dropdown">
              <a href="carpage.html" class="nav-link">Inventory</a>
            </li>
            <li class="nav-item">
              <a href="gallery.html" class="nav-link">Models</a>
            </li>
            <li class="nav-item dropdown">
              <a href="#" class="nav-link dropdown-link"
                >Events <i class="bx bx-chevron-down dropdown-icon"></i
              ></a>
              <ul class="dropdown-menu">
                <li><a href="#" class="nav-link">Recent Jobs</a></li>
                <li><a href="#" class="nav-link">Best Jobs</a></li>
                <li><a href="#" class="nav-link">Work Awards</a></li>
              </ul>
            </li>
            <li class="nav-item">
              <a href="contact.html" class="nav-link">Contact</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">Company Info</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="banner" id="carouselBanner">
      <div class="slider" id="carouselSlider" style="--quantity: 10">
        <div class="items" style="--position: 1">
          <a href="#">
            <img src="img/image-1.jpg" alt="Image 1" />
          </a>
        </div>
        <div class="items" style="--position: 2">
          <a href="#">
            <img src="img/image-2.jpg" alt="Image 2" />
          </a>
        </div>
        <div class="items" style="--position: 3">
          <a href="#">
            <img src="img/image-3.jpg" alt="Image 3" />
          </a>
        </div>
        <div class="items" style="--position: 4">
          <a href="#">
            <img src="img/image-4.jpg" alt="Image 4" />
          </a>
        </div>
        <div class="items" style="--position: 5">
          <a href="#">
            <img src="img/image-5.jpg" alt="Image 5" />
          </a>
        </div>
        <div class="items" style="--position: 6">
          <a href="#">
            <img src="img/image-6.jpg" alt="Image 6" />
          </a>
        </div>
        <div class="items" style="--position: 7">
          <a href="#">
            <img src="img/image-7.jpg" alt="Image 7" />
          </a>
        </div>
        <div class="items" style="--position: 8">
          <a href="#">
            <img src="img/image-8.jpg" alt="Image 8" />
          </a>
        </div>
        <div class="items" style="--position: 9">
          <a href="#">
            <img src="img/img1.jpg" alt="Image 9" />
          </a>
        </div>
        <div class="items" style="--position: 10">
          <a href="#">
            <img src="img/img2.jpg" alt="Image 10" />
          </a>
        </div>
      </div>
    </div>
    <footer
      style="
        background-color: black;
        padding: 1.4rem;
        font-family: sans-serif;
        text-align: center;
        color: white;
      "
    >
      © 2025 Copyright: High Wheels
    </footer>
    <script>
      const slider = document.getElementById("carouselSlider");
      const banner = document.getElementById("carouselBanner");
      let currentAngle = 30;
      let isDragging = false;
      let lastX = 0;
      let velocity = 2;
      function rotate() {
        slider.style.transform = `translateX(-50%) rotateY(${currentAngle}deg)`;
        requestAnimationFrame(rotate);
      }
      rotate();
      banner.addEventListener("mousedown", (e) => {
        isDragging = true;
        lastX = e.clientX;
        velocity = 0;
        banner.style.cursor = "grabbing";
      });
      document.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - lastX;
        velocity = deltaX * 0.3;
        currentAngle += velocity;
        lastX = e.clientX;
      });
      document.addEventListener("mouseup", () => {
        isDragging = false;
        banner.style.cursor = "grab";
      });
      banner.addEventListener("touchstart", (e) => {
        isDragging = true;
        lastX = e.touches[0].clientX;
        velocity = 0;
        banner.style.cursor = "grabbing";
      });
      document.addEventListener("touchmove", (e) => {
        if (!isDragging) return;
        const deltaX = e.touches[0].clientX - lastX;
        velocity = deltaX * 0.3;
        currentAngle += velocity;
        lastX = e.touches[0].clientX;
      });
      document.addEventListener("touchend", () => {
        isDragging = false;
        banner.style.cursor = "grab";
      });
    </script>
  </body>
</html>
