<body>
  <div class="filter-bar">
    <label for="brandSelect">Filter by Brand:</label>
    <select id="brandSelect">
      <option value="All">All</option>
    </select>

    <label for="yearSelect">Filter by Year:</label>
    <select id="yearSelect">
      <option value="All">All</option>
    </select>
  </div>

  <div class="gallery" id="carGallery"></div>
<footer style="
  background-color: black;
  padding: 1.4rem;
  font-family: sans-serif;
  text-align: center;
  color: white;
">
  © 2025 Copyright: High Wheels
</footer>

  <script>
  const cars = [
  {
    brand: "Lamborghini",
    year: 2019,
    title: "2019 Lamborghini Urus",
    desc: "Luxury SUV with performance.",
    image: "https://www.lamborghinigoldcoast.com/imagetag/7270/2/l/Used-2019-Lamborghini-Urus-1740764142.jpg"
  },
  {
    brand: "Ferrari",
    year: 2021,
    title: "2021 Ferrari Roma",
    desc: "Timeless design meets modern performance.",
    image: "https://www.lamborghinigoldcoast.com/imagetag/11820/2/l/Used-2021-Ferrari-Roma-1746293442.jpg"
  },
  {
    brand: "Mercedes",
    year: 2021,
    title: "2021 Mercedes-Benz G-Class AMG G 63",
    desc: "Luxury off-road SUV with AMG power.",
    image: "https://www.lamborghinigoldcoast.com/imagetag/11333/2/l/Used-2021-Mercedes-Benz-G-Class-AMG-G-63-1741812758.jpg"
  },
  {
    brand: "Rolls-Royce",
    year: 2020,
    title: "2020 Rolls-Royce Phantom",
    desc: "Ultimate luxury sedan.",
    image: "https://www.lamborghinigoldcoast.com/imagetag/9515/2/l/Used-2020-Rolls-Royce-Phantom-1707862837.jpg"
  },
  {
    brand: "Bentley",
    year: 2020,
    title: "2020 Bentley Continental GT W12",
    desc: "A luxury grand tourer.",
    image: "https://www.lamborghinigoldcoast.com/imagetag/10595/2/l/Used-2020-Bentley-Continental-GT-GT-W12-1740766143.jpg"
  }
];

cars.sort((a, b) => a.brand.localeCompare(b.brand));

const gallery = document.getElementById("carGallery");
const brandSelect = document.getElementById("brandSelect");
const yearSelect = document.getElementById("yearSelect");
const brands = ["All", ...new Set(cars.map(car => car.brand))];
const years = ["All", ...new Set(cars.map(car => car.year))];

brands.forEach(brand => {
  const option = document.createElement("option");
  option.value = brand;
  option.textContent = brand;
  brandSelect.appendChild(option);
});

years.forEach(year => {
  const option = document.createElement("option");
  option.value = year;
  option.textContent = year;
  yearSelect.appendChild(option);
});

function renderGallery() {
  const brandFilter = brandSelect.value;
  const yearFilter = yearSelect.value;

  const filteredCars = cars.filter(car => {
    const brandMatch = brandFilter === "All" || car.brand === brandFilter;
    const yearMatch = yearFilter === "All" || car.year == yearFilter;
    return brandMatch && yearMatch;
  });

  gallery.innerHTML = "";

  filteredCars.forEach(car => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${car.image}" alt="${car.title}" />
      <div class="card-content">
        <h3>${car.title}</h3>
        <p>${car.desc}</p>
        <p><strong>${car.year}</strong> • ${car.brand}</p>
      </div>
    `;
    gallery.appendChild(card);
  });
}

renderGallery();
brandSelect.addEventListener("change", renderGallery);
yearSelect.addEventListener("change", renderGallery);</script>
<script src="/js/menumove.js"></script>
</body>
